<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer and Inner Rings -->
  <g stroke="#2084ff" fill="none" opacity="0.85">
    <circle cx="100" cy="100" r="94" stroke-width="4" />
    <circle cx="100" cy="100" r="88" stroke-width="1.5" />
    <circle cx="100" cy="100" r="54" stroke-width="1.5" />
    <circle cx="100" cy="100" r="48" stroke-width="1" stroke-dasharray="3 4" />
  </g>

  <!-- Invisible Paths for Text Layout -->
  <path id="topArc" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <path id="bottomArc" d="M 23 100 A 77 77 0 0 0 177 100" fill="none" />

  <!-- Circular Text -->
  <text fill="#2084ff" font-family="Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="2" opacity="0.85">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">NAVDIVA GROUP</textPath>
  </text>
  <text fill="#2084ff" font-family="Arial, sans-serif" font-weight="bold" font-size="11" letter-spacing="1" opacity="0.85">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">AUTHORIZED CORPORATE SEAL</textPath>
  </text>

  <!-- Divider Stars & Center Stamp Content -->
  <text x="29" y="105" fill="#2084ff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" opacity="0.85">★</text>
  <text x="171" y="105" fill="#2084ff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" opacity="0.85">★</text>
  <text x="100" y="94" fill="#2084ff" font-family="Arial, sans-serif" font-weight="900" font-size="34" text-anchor="middle" opacity="0.85">ND</text>
  <line x1="70" y1="104" x2="130" y2="104" stroke="#2084ff" stroke-width="1.5" opacity="0.85" />
  <text x="100" y="118" fill="#2084ff" font-family="Arial, sans-serif" font-weight="bold" font-size="10" letter-spacing="2" text-anchor="middle" opacity="0.85">EST. 2019</text>
</svg>