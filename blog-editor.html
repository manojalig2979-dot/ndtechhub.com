<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a Post — NDTechHub Blog</title>
  <meta name="description" content="Write and publish a post on the NDTechHub Blog." />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Quill.js Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/bento.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <style>
    .blog-header-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px; background: rgba(8,12,20,.92);
      backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,.07);
      position: sticky; top: 0; z-index: 100;
      pointer-events: auto;
    }
    .blog-header-bar .logo {
      font-size: 20px; font-weight: 900; color: #fff; text-decoration: none;
      letter-spacing: -.03em;
    }
    .blog-header-bar .logo span { color: #00f2fe; }

    /* Quill Dark Theme Override */
    .ql-toolbar.ql-snow {
      background: rgba(255,255,255,.04) !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      border-bottom: none !important;
      border-radius: 12px 12px 0 0 !important;
    }
    .ql-container.ql-snow {
      background: rgba(255,255,255,.02) !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      border-top: none !important;
      border-radius: 0 0 12px 12px !important;
      min-height: 400px;
    }
    .ql-editor { color: rgba(255,255,255,.85); font-size: 15px; line-height: 1.8; min-height: 380px; font-family: 'Inter', sans-serif; }
    .ql-editor.ql-blank::before { color: rgba(255,255,255,.25); font-style: normal; }
    .ql-snow .ql-stroke { stroke: rgba(255,255,255,.6) !important; }
    .ql-snow .ql-fill  { fill: rgba(255,255,255,.6) !important; }
    .ql-snow .ql-picker-label,.ql-snow .ql-picker-item { color: rgba(255,255,255,.7) !important; }
    .ql-snow .ql-picker-options { background: #1a2035 !important; border-color: rgba(255,255,255,.1) !important; }
    .ql-snow .ql-active .ql-stroke { stroke: #00f2fe !important; }
    .ql-snow .ql-active .ql-fill  { fill: #00f2fe !important; }
    .ql-snow a { color: #00f2fe !important; }

    /* Editor form fields */
    .editor-field {
      width: 100%; padding: 14px 18px; margin-bottom: 16px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; color: #fff; font-size: 15px; outline: none;
      box-sizing: border-box; font-family: 'Inter', sans-serif; transition: border-color .2s;
    }
    .editor-field:focus { border-color: rgba(0,242,254,.4); }
    .editor-field::placeholder { color: rgba(255,255,255,.28); }

    .upload-btn-label {
      padding: 14px 20px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: rgba(255,255,255,.8);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      transition: all .2s;
      white-space: nowrap;
      user-select: none;
      justify-content: center;
    }
    .upload-btn-label:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(0,242,254,.4);
      color: #fff;
    }

    /* Auth gate (shown when not logged in) */
    #editor-auth-gate {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; text-align: center; gap: 16px;
    }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/firebase-init.js"></script>
</head>
<body class="selection:bg-brand-500/30 selection:text-brand-400 font-sans antialiased min-h-screen relative flex flex-col justify-between text-slate-300">
  <div class="ambient-orb w-[600px] h-[600px] bg-sky-600/15 top-[-100px] left-1/2 -translate-x-1/2 animation-float-slow"></div>
  <div class="ambient-orb w-[500px] h-[500px] bg-purple-600/15 top-[600px] -left-40 animation-float-reverse"></div>
  <div class="fixed inset-0 pointer-events-none z-0 opacity-20" style="background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px); background-size: 32px 32px;"></div>


  <!-- Header -->
  <header class="blog-header-bar">
    <a href="blog" class="logo"><span>ND</span>TechHub <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.4);margin-left:4px;letter-spacing:.05em;">/ Blog Editor</span></a>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="blog" style="font-size:13px;color:rgba(255,255,255,.5);font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px;">
        <i data-lucide="x" style="width:14px;height:14px;"></i> Cancel
      </a>
      <div id="auth-header-area"></div>
    </div>
  </header>

  <!-- Auth Gate (shown when not signed in) -->
  <div id="editor-auth-gate" style="display:none;">
    <div style="font-size:64px;margin-bottom:8px;">🔐</div>
    <h2 style="font-size:24px;font-weight:800;color:#fff;margin:0 0 8px;">Sign In Required</h2>
    <p style="color:rgba(255,255,255,.45);font-size:15px;max-width:360px;line-height:1.6;margin:0 0 24px;">You need to be signed in to write a blog post on NDTechHub.</p>
    <button id="open-signin-btn" style="padding:13px 30px;border:none;background:linear-gradient(135deg,#00f2fe,#4facfe);color:#080c14;font-weight:800;font-size:15px;border-radius:12px;cursor:pointer;font-family:inherit;">Sign In to Continue</button>
    <a href="blog" style="font-size:13px;color:rgba(255,255,255,.35);margin-top:12px;text-decoration:none;">← Back to Blog</a>
  </div>

  <!-- Editor Form (shown when signed in) -->
  <div id="editor-form-area" style="display:none;">
    <main style="max-width:860px;margin:0 auto;padding:48px 32px 80px;">
      <h1 id="editor-heading" style="font-size:2rem;font-weight:900;color:#fff;letter-spacing:-.03em;margin:0 0 36px;">Write New Post</h1>

      <!-- Title -->
      <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;">Post Title *</div>
      <input type="text" id="post-title" class="editor-field" placeholder="Give your post a compelling title..." style="font-size:20px;font-weight:700;" />

      <!-- Cover Image -->
      <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;">Cover Image <span style="font-weight:400;text-transform:none;">(URL or upload from PC)</span></div>
      <div style="display:flex;gap:12px;margin-bottom:16px;align-items:stretch;">
        <input type="url" id="post-cover" class="editor-field" placeholder="https://example.com/image.jpg" style="margin-bottom:0;flex:1;" />
        <label for="cover-file-input" class="upload-btn-label">
          <i data-lucide="upload" style="width:16px;height:16px;"></i> Upload Cover
        </label>
        <input type="file" id="cover-file-input" accept="image/*" style="display:none;" />
      </div>

      <!-- Tags -->
      <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;">Tags <span style="font-weight:400;text-transform:none;">(comma separated)</span></div>
      <input type="text" id="post-tags" class="editor-field" placeholder="e.g. web, ai, performance, firebase" />

      <!-- Quill Editor -->
      <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;">Content *</div>
      <div id="quill-editor"></div>

      <!-- Actions -->
      <div style="display:flex;gap:12px;margin-top:28px;">
        <button id="publish-btn" style="flex:1;padding:15px;border:none;background:linear-gradient(135deg,#00f2fe,#4facfe);color:#080c14;font-weight:900;font-size:16px;border-radius:12px;cursor:pointer;font-family:inherit;letter-spacing:-.01em;">Publish Post</button>
        <button id="cancel-btn" style="padding:15px 24px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;font-family:inherit;">Cancel</button>
      </div>
    </main>
  </div>

  <script defer src="js/main.js"></script>
  <script type="module" src="js/blog-editor.js"></script>

  <navdiva-footer></navdiva-footer>
  <script src="js/main.js"></script>
  <script src="js/components.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ndtechhub-footer.js"></script>
</body>
</html>
