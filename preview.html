<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Live Preview Sandbox | NDTechHub</title>
  <meta name="description" content="Interactive live preview sandbox for NDTechHub website templates. View templates across Desktop, Tablet, and Mobile viewports before ordering.">
  <link rel="canonical" href="https://ndtechhub.com/templates">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ndtechhub.com/preview">
  <meta property="og:title" content="Template Live Preview | NDTechHub">
  <meta property="og:description" content="Interactive live preview sandbox for NDTechHub website templates.">
  <meta property="og:image" content="https://ndtechhub.com/assets/logos/ndtechhub.png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-23XBQD2Z6F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-23XBQD2Z6F');
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/bento.css">
  <link rel="stylesheet" href="css/pages.css">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@0.400.0"></script>


  <style>
    /* Reset and Layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04060a;
    }

    /* Persistent Top Preview Bar */
    .preview-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1200;
      pointer-events: auto;
    }

    .preview-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      transition: var(--transition-smooth);
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--accent-primary);
      background: rgba(0, 242, 254, 0.05);
    }

    .nav-brand-preview {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .nav-brand-preview:hover {
      opacity: 0.8;
    }

    .nav-brand-preview .brand-tech {
      color: var(--accent-primary);
    }

    .nav-brand-preview .dot {
      color: var(--accent-primary);
      font-size: 20px;
      line-height: 1;
    }

    .template-info-badge {
      display: flex;
      flex-direction: column;
    }

    .template-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .template-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    /* Device Toggles */
    .device-toggles {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .device-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 40px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .device-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.03);
    }

    .device-btn.active {
      background: var(--accent-gradient);
      color: #080c14;
    }

    /* Order Button */
    .order-btn {
      background: var(--accent-gradient);
      color: #080c14 !important;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .order-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    /* Frame Canvas Container */
    .iframe-canvas {
      position: absolute;
      top: 64px;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04060a;
      background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
      background-size: 24px 24px;
      padding: 20px;
      overflow: hidden;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
      background: var(--bg-primary);
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1), height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      max-height: 100%;
    }

    .iframe-wrapper.desktop {
      width: 100%;
      height: 100%;
    }

    .iframe-wrapper.tablet {
      width: 768px;
      height: 90%;
    }

    .iframe-wrapper.mobile {
      width: 375px;
      height: 85%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Persistent Header -->
  <header class="preview-header">
    <div class="preview-left">
      <a href="/" class="nav-brand-preview" aria-label="NDTechHub Home">
        ND<span class="brand-tech">Tech</span>Hub<span class="dot">.</span>
      </a>
      <span style="color: var(--glass-border); font-size: 18px; line-height: 1; margin: 0 2px;">/</span>
      <a href="templates" class="back-btn"><i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Templates</a>
      <div class="template-info-badge">
        <span class="template-label" id="template-label-el">Sandbox Live Demo</span>
        <span class="template-name" id="template-name-el">Loading design...</span>
      </div>
    </div>

    <!-- Responsive Toggles -->
    <div class="device-toggles">
      <button class="device-btn active" id="btn-desktop" onclick="setDevice('desktop')" aria-label="Desktop View">
        <i data-lucide="monitor" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="device-btn" id="btn-tablet" onclick="setDevice('tablet')" aria-label="Tablet View">
        <i data-lucide="tablet" style="width: 18px; height: 18px;"></i>
      </button>
      <button class="device-btn" id="btn-mobile" onclick="setDevice('mobile')" aria-label="Mobile View">
        <i data-lucide="smartphone" style="width: 18px; height: 18px;"></i>
      </button>
    </div>

    <!-- CTA -->
    <div style="display: flex; align-items: center; gap: 16px;">
      <span class="toolbar-price" id="toolbar-price-el" style="font-weight: 600; color: var(--text-secondary); font-size: 14px;">Starting at: ₹0</span>
      <a href="#" id="order-btn-el" class="order-btn">Order This Design <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i></a>
    </div>
  </header>

  <!-- Viewport Canvas -->
  <main class="iframe-canvas">
    <div class="iframe-wrapper desktop" id="wrapper-el">
      <iframe src="about:blank" id="preview-iframe"></iframe>
    </div>
  </main>

  <script>
    // Templates Metadata
    const templateMeta = {
      'ecommerce-store': {
        name: 'wCom E-Commerce Suite',
        service: 'ecommerce',
        package: 'standard',
        price: '₹80,000'
      },
      'saas-dashboard': {
        name: 'SaaS App Launchpad',
        service: 'web-dev',
        package: 'premium',
        price: '₹55,000'
      },
      'bento-portfolio': {
        name: 'Bento Creative Portfolio',
        service: 'web-dev',
        package: 'startup',
        price: '₹25,000'
      },
      'clinic-scheduler': {
        name: 'MediBook Clinic Scheduler',
        service: 'web-dev',
        package: 'custom',
        price: '₹45,000'
      },
      'agency-portal': {
        name: 'Nova Consulting & Agency Portal',
        service: 'web-dev',
        package: 'custom',
        price: '₹35,000'
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      // Parse Query Parameter
      const urlParams = new URLSearchParams(window.location.search);
      const templateId = urlParams.get('template') || 'ecommerce-store';
      const iframe = document.getElementById('preview-iframe');
      
      // Load corresponding page
      iframe.src = `templates/${templateId}.html`;

      // Update Top Bar details
      const meta = templateMeta[templateId] || { name: 'Custom Design', service: 'other', package: 'custom', price: '₹0' };
      document.getElementById('template-name-el').textContent = meta.name;
      document.getElementById('toolbar-price-el').textContent = `Starting at: ${meta.price}`;
      
      // Construct redirection URL
      document.getElementById('order-btn-el').href = `contact?template=${templateId}&package=${meta.package}&service=${meta.service}`;
    });

    // Handle Responsive Frame width changes
    function setDevice(device) {
      // Remove active classes
      document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
      
      // Set active
      document.getElementById(`btn-${device}`).classList.add('active');

      // Adjust wrapper classes
      const wrapper = document.getElementById('wrapper-el');
      wrapper.className = `iframe-wrapper ${device}`;
    }
  </script>
</body>
</html>
